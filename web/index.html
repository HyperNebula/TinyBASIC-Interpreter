<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TINY BASIC Interpreter</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 800px;
                margin: 2rem auto;
            }
            textarea {
                width: 100%;
                height: 200px;
                font-family: monospace;
                font-size: 16px;
                padding: 10px;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                margin: 10px 0;
                cursor: pointer;
            }
            pre {
                background: #1e1e1e;
                color: #00ff00;
                padding: 15px;
                min-height: 100px;
                overflow-x: auto;
            }
        </style>
    </head>
    <body>
        <h1>Nim TINY BASIC Interpreter</h1>

        <textarea id="codeInput">
            PRINT "HELLO WORLD"
            GOTO 10
        </textarea>
        <br />
        <button id="runButton">Run Code</button>

        <h2>Output:</h2>
        <pre id="outputConsole">Ready...</pre>

        <!-- include the compiled JS code -->
        <script src="interpreter.js"></script>

        <script>
            const originalConsoleLog = console.log;
            const outputConsole = document.getElementById("outputConsole");

            console.log = function (...args) {
                const message = args.map((arg) => String(arg)).join(" ");
                outputConsole.textContent += message + "\n";
                originalConsoleLog.apply(console, args);
            };

            document
                .getElementById("runButton")
                .addEventListener("click", () => {
                    const code = document.getElementById("codeInput").value;

                    outputConsole.textContent = "Running...\n";

                    try {
                        originalConsoleLog(code);
                        runFile(code);

                        outputConsole.textContent +=
                            "\n--- Execution Complete ---";
                    } catch (error) {
                        outputConsole.textContent += "\nFatal Error: " + error;
                    }
                });
        </script>
    </body>
</html>
