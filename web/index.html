<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TinyBASIC Interpreter</title>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>TinyBASIC Interpreter</h1>

        <textarea id="codeInput"> </textarea>
        <br />
        <button id="runButton">Run Code</button>

        <h2>Output:</h2>
        <pre id="outputConsole">Ready...</pre>

        <!-- include the compiled JS code -->
        <script src="tinybasic.js"></script>

        <script>
            const originalConsoleLog = console.log;
            const outputConsole = document.getElementById("outputConsole");

            console.log = function (...args) {
                const message = args.map((arg) => String(arg)).join(" ");
                outputConsole.textContent += message + "\n";
                originalConsoleLog.apply(console, args);
            };

            document
                .getElementById("runButton")
                .addEventListener("click", () => {
                    const code = document.getElementById("codeInput").value;

                    outputConsole.textContent = "Running...\n";

                    try {
                        originalConsoleLog(code);
                        runFile(code);

                        outputConsole.textContent +=
                            "\n--- Execution Complete ---";
                    } catch (error) {
                        outputConsole.textContent += "\nFatal Error: " + error;
                    }
                });
        </script>
    </body>
</html>
